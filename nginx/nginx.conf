worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Gzip on text assets. Videos are served by Bunny, not through this proxy.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
  gzip_min_length 1024;

  # Stripe webhook bodies are small, but keep a reasonable cap for any
  # form-encoded admin uploads (cover images, etc.). Actual video uploads
  # go directly from the browser to Bunny via TUS — they do not traverse
  # this proxy.
  client_max_body_size 20m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";

  upstream courseforge_app {
    server app:3000;
  }

  server {
    listen 80;
    server_name _;

    # Stripe webhooks must not be buffered so the raw body reaches the
    # handler for signature verification.
    location /api/webhooks/ {
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_pass http://courseforge_app;
    }

    # Stream Server-Sent Events / long-lived fetches without buffering.
    location /api/ {
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass http://courseforge_app;
    }

    location / {
      proxy_pass http://courseforge_app;
    }
  }
}
