name: courseforge-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: courseforge-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: courseforge
      POSTGRES_PASSWORD: courseforge
      POSTGRES_DB: courseforge
    ports:
      - "5455:5432"
    volumes:
      - courseforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseforge -d courseforge"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  courseforge_pgdata:
