name: coursemaker-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: coursemaker-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: coursemaker
      POSTGRES_PASSWORD: coursemaker
      POSTGRES_DB: coursemaker
    ports:
      - "5455:5432"
    volumes:
      - coursemaker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursemaker -d coursemaker"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  coursemaker_pgdata:
